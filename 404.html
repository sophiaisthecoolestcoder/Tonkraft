<!doctype html>
<html lang="de" class="no-js lang-de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4efe5" />
    <title>Seite nicht gefunden — Tonkraft</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("tonkraft:lang");
          var b = (navigator.language || "de").toLowerCase().indexOf("en") === 0 ? "en" : "de";
          var l = s === "en" || s === "de" ? s : b;
          var r = document.documentElement;
          r.classList.remove("lang-de", "lang-en");
          r.classList.add("lang-" + l);
          r.lang = l;
        } catch (e) {}
      })();
    </script>
    <script defer src="/js/main.js"></script>
  </head>
  <body>
    <main id="main" class="hero" style="text-align:center;">
      <div class="hero__inner">
        <div class="hero__seal" aria-hidden="true">&#x0914;&#x0902;</div>
        <h1 class="hero__word" style="font-size:var(--fs-2xl);">404</h1>
        <p class="hero__tagline">
          <span lang="de">Diese Seite konnte nicht gefunden werden.</span>
          <span lang="en">This page could not be found.</span>
        </p>
        <p style="margin-top:2rem;">
          <a class="btn btn--primary" href="/index.html"><span lang="de">Zur Startseite</span><span lang="en">Back home</span><span class="btn__arrow" aria-hidden="true">→</span></a>
        </p>
      </div>
    </main>
  </body>
</html>
